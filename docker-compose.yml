# Para quem não tem Postgres local: `docker compose up -d` e use
# DATABASE_URL=postgres://plenario:plenario@localhost:5433/plenario
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: plenario
      POSTGRES_PASSWORD: plenario
      POSTGRES_DB: plenario
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
